services:
  # ============================================================
  # Apache Kafka (KRaft Mode - Confluent Image)
  # ============================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # KRaft mode configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - log-network

  # ============================================================
  # Kafka Topic Initialization
  # ============================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic raw-logs --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic processed-logs --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic anomalous-logs --partitions 3 --replication-factor 1
      echo 'Topics created successfully:'
      kafka-topics --bootstrap-server kafka:9092 --list
      echo 'Kafka initialization complete!'
      "
    networks:
      - log-network

  # ============================================================
  # Apache Spark Master
  # ============================================================
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master Port
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_KAFKA_BOOTSTRAP=kafka:9092
    volumes:
      - spark_data:/opt/spark/work
      - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - log-network

  # ============================================================
  # Apache Spark Worker
  # ============================================================
  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    user: root
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8081:8081"   # Spark Worker Web UI
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_KAFKA_BOOTSTRAP=kafka:9092
    volumes:
      - spark_worker_data:/opt/spark/work
      - .:/app
    networks:
      - log-network

  # ============================================================
  # Log Generation Agents (Distributed)
  # ============================================================
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - NUM_AGENTS=1
    networks:
      - log-network
    deploy:
      replicas: 3

volumes:
  kafka_data:
    driver: local
  spark_data:
    driver: local
  spark_worker_data:
    driver: local

networks:
  log-network:
    driver: bridge
